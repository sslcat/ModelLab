name: Verify ModelLab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RUNPOD_API_KEY: ""
      MODELLAB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run build
      - run: python -m unittest discover -s tests
      - run: python -m research.public_results
      - run: python -m research.report --check
      - run: python -m research.audit_release
      - run: node tests/browser.mjs
        env:
          MODELLAB_PYTHON: python
      - run: node tests/browser.mjs --demo
        env:
          MODELLAB_PYTHON: python
      - name: Check GitHub-style math with MathJax
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/mathjax" --no-save --no-package-lock --ignore-scripts mathjax-full@3.2.2
          node tests/math.cjs "$RUNNER_TEMP/mathjax"
